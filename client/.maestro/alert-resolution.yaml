appId: com.geronton.client
---
# The caregiver sends a short check-in with high glycemia, which raises a
# signal. The professional then sees it on the dashboard, opens it and marks
# the contact as done.
#
# Needs cuidador@demo.com with exactly one elder (so login lands on the
# elder's hub) and profissional@demo.com linked to that same elder.
- launchApp:
    clearState: true
- tapOn:
    id: "login-email"
- inputText: "cuidador@demo.com"
- tapOn:
    id: "login-password"
- inputText: "senha123"
- hideKeyboard
- tapOn:
    id: "login-submit"
- assertVisible:
    id: "profile-detail"
- tapOn:
    id: "detail-checkin"
- assertVisible:
    id: "checkin"
# short version, 3 steps
- tapOn:
    id: "checkin-short"
- scrollUntilVisible:
    element:
      id: "checkin-skinIssues-no"
    direction: DOWN
- tapOn:
    id: "checkin-skinIssues-no"
- scrollUntilVisible:
    element:
      id: "checkin-bowelRegular-yes"
    direction: DOWN
- tapOn:
    id: "checkin-bowelRegular-yes"
- scrollUntilVisible:
    element:
      id: "checkin-sleepWell-yes"
    direction: DOWN
- tapOn:
    id: "checkin-sleepWell-yes"
- scrollUntilVisible:
    element:
      id: "checkin-unstableGait-no"
    direction: DOWN
- tapOn:
    id: "checkin-unstableGait-no"
- scrollUntilVisible:
    element:
      id: "checkin-glycemia"
    direction: DOWN
- tapOn:
    id: "checkin-glycemia"
- inputText: "300"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "checkin-next"
    direction: DOWN
- tapOn:
    id: "checkin-next"
- scrollUntilVisible:
    element:
      id: "checkin-appetite-good"
    direction: DOWN
- tapOn:
    id: "checkin-appetite-good"
- scrollUntilVisible:
    element:
      id: "checkin-hydrationGoal-yes"
    direction: DOWN
- tapOn:
    id: "checkin-hydrationGoal-yes"
- scrollUntilVisible:
    element:
      id: "checkin-medsOnTime-yes"
    direction: DOWN
- tapOn:
    id: "checkin-medsOnTime-yes"
- tapOn:
    id: "checkin-next"
- scrollUntilVisible:
    element:
      id: "checkin-mood-happy"
    direction: DOWN
- tapOn:
    id: "checkin-mood-happy"
- scrollUntilVisible:
    element:
      id: "checkin-sunExposure-yes"
    direction: DOWN
- tapOn:
    id: "checkin-sunExposure-yes"
- scrollUntilVisible:
    element:
      id: "checkin-selfExpression-yes"
    direction: DOWN
- tapOn:
    id: "checkin-selfExpression-yes"
- scrollUntilVisible:
    element:
      id: "checkin-stimulation-yes"
    direction: DOWN
- tapOn:
    id: "checkin-stimulation-yes"
- tapOn:
    id: "checkin-submit"
# back on the hub, the caregiver also sees the signal
- assertVisible:
    id: "profile-detail"
- assertVisible:
    text: "Glicemia 300.*"
- tapOn:
    id: "header-account"
- tapOn:
    id: "header-signout"
# professional side
- tapOn:
    id: "login-email"
- inputText: "profissional@demo.com"
- tapOn:
    id: "login-password"
- inputText: "senha123"
- hideKeyboard
- tapOn:
    id: "login-submit"
- assertVisible:
    id: "professional-home"
- assertVisible:
    text: "Sinais para contato"
- tapOn:
    text: "Glicemia 300.*"
- assertVisible:
    id: "profile-detail"
- tapOn:
    id: "detail-alert-.*-resolve"
- assertVisible:
    text: "Depois do contato, o sinal procedia?"
- tapOn:
    id: "detail-alert-.*-verdict-yes"
- assertNotVisible:
    text: "Glicemia 300.*"
